---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Default containerd config with systemd cgroups
  ansible.builtin.shell: |
    set -eo pipefail
    mkdir -p /etc/containerd
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
  args: { creates: /etc/containerd/config.toml, executable: /bin/bash }

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true

- name: Kubernetes apt key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

# Drop the one-line repo file older runs of this role left behind, so a
# re-run against an existing cluster doesn't end up with the same repo
# configured twice (apt then warns on every update).
- name: Remove legacy one-line Kubernetes apt repo
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pkgs_k8s_io_core_stable_v{{ k8s_version | replace('.', '_') }}_deb.list
    state: absent

# deb822 form: apt_repository is deprecated and goes away in ansible-core 2.25.
# pkgs.k8s.io is a flat repo, hence `suites: /` and no components.
- name: Kubernetes apt repo
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/"
    suites: "/"
    signed_by: /etc/apt/keyrings/kubernetes.asc
    state: present

- name: Install kubeadm/kubelet/kubectl
  ansible.builtin.apt:
    name: [kubeadm, kubelet, kubectl]
    state: present
    update_cache: true

- name: Hold kube packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubeadm, kubelet, kubectl]
