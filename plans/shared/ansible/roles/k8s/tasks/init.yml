---
- name: Kubeadm init
  ansible.builtin.command: >
    kubeadm init --pod-network-cidr={{ k8s_pod_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
  args: { creates: /etc/kubernetes/admin.conf }

- name: Kubeconfig for ubuntu user
  ansible.builtin.shell: |
    set -e
    mkdir -p /home/ubuntu/.kube
    cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
    chown -R ubuntu:ubuntu /home/ubuntu/.kube
  args: { creates: /home/ubuntu/.kube/config }

- name: Install Flannel CNI
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f {{ k8s_flannel_url }}
  register: k8s_flannel
  changed_when: "'created' in k8s_flannel.stdout or 'configured' in k8s_flannel.stdout"

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_join_cmd
  changed_when: false

- name: Share join command with workers
  ansible.builtin.set_fact:
    k8s_join_command: "{{ k8s_join_cmd.stdout }}"
