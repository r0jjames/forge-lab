replicaCount: 1
# ingress is not created (no controller in this local lab); access is via
# `make ui` -> kubectl port-forward, which is plain HTTP. The chart defaults
# ingress.https to true even when ingress.create is false, which makes Bamboo
# assume it's behind a TLS-terminating proxy and emit https:// redirects —
# breaking both the readiness probe and browser access over a plain
# port-forward. Chart's own values.yaml comment: "Set to 'false' if not using
# TLS, e.g. when reaching the service via localhost port-forwarding."
ingress:
  https: false
bamboo:
  # Broker URL advertised to remote agents. By default Bamboo hands agents the
  # in-cluster pod FQDN (bamboo-0.bamboo.ci.svc.cluster.local:54663), which a
  # host-local agent cannot resolve or reach. Point it at localhost so the
  # agent connects through the `make ui` port-forward of the JMS port (54663).
  # verifyHostName=false because the broker's TLS cert isn't issued for
  # "localhost"; the agent still trusts it via the fingerprint exchange.
  brokerUrl: "ssl://localhost:54663?socket.verifyHostName=false&wireFormat.maxInactivityDuration=90000"
  # The server advertises a broker client URI to agents, which it auto-derives
  # from its own pod hostname (bamboo-0.bamboo.ci.svc.cluster.local) and writes
  # to bamboo.jms.broker.client.uri in bamboo.cfg.xml at setup. A host-local
  # agent can't resolve that in-cluster FQDN, so registration succeeds but the
  # JMS connection fails over forever. brokerUrl above (ATL_CLIENT_BROKER_URL)
  # does NOT override that key, and cfg.xml is generated once (forceConfigUpdate
  # is false), so we override it every boot as a JVM system property pointed at
  # localhost — reachable through the `make ui` port-forward of 54663.
  # NOTE: exactly one query param, so no '&'. catalina.sh eval's this JVM arg,
  # and an '&' is parsed as a shell separator (eval: <after-&>: not found ->
  # exit 127 crash loop). verifyHostName=false is required because the broker's
  # TLS cert is issued for the pod hostname, not localhost; keepalive tuning
  # (maxInactivityDuration) is dropped to stay single-param and eval-safe.
  additionalJvmArgs:
    - "-Dbamboo.jms.broker.client.uri=ssl://localhost:54663?socket.verifyHostName=false"
  # Unattended setup — skip the first-run wizard entirely. The chart writes
  # unattended-setup.properties from these secrets on first boot; without them
  # the properties file has empty admin/license/token fields, unattended setup
  # aborts, and Bamboo falls back to the manual wizard. The manual wizard never
  # applies bamboo.broker.uri, so the JMS broker (54663) never binds and remote
  # agents can't connect (/agentServer/ 404s). All three secrets are created by
  # `make bootstrap` at runtime — the license key never lands in git.
  unattendedSetup: true
  license:
    secretName: bamboo-license      # key: license (24h timebomb, runtime-only)
  sysadminCredentials:
    secretName: bamboo-sysadmin      # keys: username/password/displayName/emailAddress
  securityToken:
    secretName: bamboo-agent-token   # key: security-token; shared with the host agent
  resources:
    container:
      requests: { cpu: "1", memory: 3Gi }
      limits: { cpu: "2", memory: 4Gi }
database:
  type: postgresql
  url: jdbc:postgresql://postgres-postgresql.ci.svc.cluster.local:5432/bamboo
  credentials:
    secretName: bamboo-db-creds
volumes:
  localHome:
    persistentVolumeClaim:
      create: true
      resources:
        requests:
          storage: 5Gi
  # Without this the chart mounts shared-home as an emptyDir, so the
  # bamboo-shared.cfg.xml written during the setup wizard is lost on any pod
  # restart — bootstrap then fails with "Shared configuration ... does not
  # exist". accessModes is forced to ReadWriteOnce because the local-path
  # storageclass (Rancher Desktop default) is RWO-only; the chart default of
  # ReadWriteMany leaves the PVC Pending. Single-node lab, so RWO is fine.
  sharedHome:
    persistentVolumeClaim:
      create: true
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
