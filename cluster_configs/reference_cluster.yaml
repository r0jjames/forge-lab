# Every technology, every knob, all switched on. This is the reference: diff a
# real config against it to see what you left out.
#
# DO NOT PROVISION THIS ON A 64G HOST. It asks for 66G of guest RAM before
# macOS and Rancher Desktop take their share:
#
#   management     1 x 4G  =  4G
#   compute        2 x 3G  =  6G
#   hdfs           1 x 4G + 3 x 4G = 16G
#   opensearch     3 x 6G  = 18G
#   splunk         4G + 2 x 6G + 6G = 22G
#   keycloak       0G (pods on the k8s cluster)
#                          ------
#                            66G   across 14 VMs
#
# It is valid, not buildable here: OpenSearch and Splunk fill the same slot, so
# a real cluster runs one of them. Pick lab1 (splunk) or opensearch1 instead.
#
# cluster.type must be k8s for this file, because keycloak is enabled — see
# dcos1_cluster.yaml for the dcos shape.

cluster:
  type: k8s

cluster_nodes:
  # `management` is required: the k8s, dcos and keycloak roles all take their
  # control node from it. Every other cluster_nodes key is yours to name — the
  # key becomes the VM name and the ansible group.
  management:
    count: 1
    cpu: 2
    memory: 4G
    disk: 20G

  compute:
    count: 2
    cpu: 2
    memory: 3G
    disk: 20G

technologies:
  # Runs as pods on the cluster the cluster_nodes already form, so it declares
  # no nodes at all — and must not, or validation rejects it.
  keycloak:
    enabled: true

  hdfs:
    enabled: true
    nodes:
      # Exactly one, always: HDFS here is non-HA. Metadata only, no blocks.
      namenode:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      datanode:
        count: 3
        cpu: 2
        memory: 4G
        disk: 40G

  opensearch:
    enabled: true
    nodes:
      # Node 1 also runs Dashboards on 5601.
      master:
        count: 3
        cpu: 2
        memory: 6G
        disk: 40G

  splunk:
    enabled: true
    nodes:
      # Exactly one. Owns the index bundle every peer runs.
      cluster-manager:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      # At least two: the manager runs replication_factor = 2 and a peer
      # cannot replicate to itself. Sized for emulation — Splunk Enterprise
      # has no arm64 build and runs amd64 under qemu-user here.
      indexer:
        count: 2
        cpu: 4
        memory: 6G
        disk: 60G

      # Exactly one. A search head *cluster* needs three members plus a
      # deployer, which this lab does not build.
      search-head:
        count: 1
        cpu: 4
        memory: 6G
        disk: 30G
