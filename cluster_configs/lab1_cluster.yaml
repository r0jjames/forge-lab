# The lab's default cluster. Provision it with:
#   make provision CLUSTER=lab1
#
# Splunk is the search-and-logging technology here; OpenSearch is parked
# because the two fill the same slot and running both costs 40G. The OpenSearch
# shape lives in opensearch1_cluster.yaml rather than behind a flag in this
# file. See cluster_configs/README.md for the full technology reference.
#
# A technology with `enabled: false` keeps its sizing here, unvalidated, so it
# can be switched back on without retyping it.
#
# 11 VMs, 28 vCPU, 48G RAM.

cluster:
  type: k8s

cluster_nodes:
  management:
    count: 1
    cpu: 2
    memory: 4G
    disk: 20G

  compute:
    count: 2
    cpu: 2
    memory: 3G
    disk: 20G

technologies:
  hdfs:
    enabled: true
    nodes:
      # Non-HA HDFS has exactly one NameNode, and it stores metadata only.
      namenode:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      datanode:
        count: 3
        cpu: 2
        memory: 4G
        disk: 40G

  opensearch:
    enabled: false
    nodes:
      master:
        count: 3
        cpu: 2
        memory: 6G
        disk: 40G

  keycloak:
    enabled: true

  splunk:
    enabled: true
    nodes:
      # One manager per cluster. It owns the index bundle the peers run.
      cluster-manager:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      # Two is the floor: the manager runs replication_factor = 2.
      # Sized for emulation — there is no arm64 Splunk Enterprise build.
      indexer:
        count: 2
        cpu: 4
        memory: 6G
        disk: 60G

      # One search head, not a search head cluster — that needs three members
      # and a deployer, which this lab does not build.
      search-head:
        count: 1
        cpu: 4
        memory: 6G
        disk: 30G
