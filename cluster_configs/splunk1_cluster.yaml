# The Splunk lab cluster. Provision it with:
#   make provision CLUSTER=splunk1
# A technology with `enabled: false` keeps its sizing here, unvalidated, so it
# can be switched back on without retyping it.
#
# OpenSearch is parked rather than deleted: it and Splunk fill the same slot in
# this lab, and running both costs 18G that the Splunk nodes need. Splunk's
# Enterprise nodes run the amd64 build under qemu-user translation (there is no
# ARM64 Splunk Enterprise), so they are sized for emulation overhead — see
# docs/superpowers/specs/2026-08-07-splunk-technology-design.md.

cluster:
  type: k8s

cluster_nodes:
  management:
    count: 1
    cpu: 2
    memory: 4G
    disk: 20G

  compute:
    count: 2
    cpu: 2
    memory: 3G
    disk: 20G

technologies:
  hdfs:
    enabled: true
    nodes:
      # Non-HA HDFS has exactly one NameNode, and it stores metadata only.
      namenode:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      datanode:
        count: 3
        cpu: 2
        memory: 4G
        disk: 40G

  opensearch:
    enabled: false
    nodes:
      master:
        count: 3
        cpu: 2
        memory: 6G
        disk: 40G

  keycloak:
    enabled: true

  splunk:
    enabled: true
    nodes:
      # One manager per cluster, and it doubles as the license manager.
      cluster-manager:
        count: 1
        cpu: 2
        memory: 4G
        disk: 20G

      # Two is the floor: the manager runs replication_factor = 2.
      indexer:
        count: 2
        cpu: 4
        memory: 6G
        disk: 60G

      # One search head, not a search head cluster — that needs three members
      # and a deployer, which this lab does not build.
      search-head:
        count: 1
        cpu: 4
        memory: 6G
        disk: 30G
