---
- name: OpenSearch service account
  ansible.builtin.user:
    name: "{{ opensearch_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ opensearch_data_dir }}"
    create_home: false

- name: Install and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0755"
  loop:
    - "{{ opensearch_home }}"
    - "{{ opensearch_data_dir }}"
    - "{{ opensearch_data_dir }}/data"
    - "{{ opensearch_data_dir }}/logs"

# Multipass VMs are arm64 on Apple Silicon and amd64 elsewhere; OpenSearch's
# own asset names use "x64" rather than "amd64" for the latter — verified
# against the published artifact names, not assumed.
- name: Resolve the OpenSearch release asset for this architecture
  ansible.builtin.set_fact:
    opensearch_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}"

- name: Download and unpack OpenSearch
  ansible.builtin.unarchive:
    src: >-
      {{ opensearch_mirror }}/opensearch/{{ opensearch_version }}/opensearch-{{ opensearch_version }}-linux-{{ opensearch_arch }}.tar.gz
    dest: "{{ opensearch_home }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    creates: "{{ opensearch_home }}/bin/opensearch"

# OpenSearch refuses to start below this map count and the kernel default is
# far short of it; this is a global sysctl, not something the unit can raise
# for itself.
- name: Raise vm.max_map_count for OpenSearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true

- name: OpenSearch configuration
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_home }}/config/opensearch.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0644"
  notify: Restart opensearch

- name: OpenSearch systemd unit
  ansible.builtin.template:
    src: opensearch.service.j2
    dest: /etc/systemd/system/opensearch.service
    mode: "0644"
  notify: Restart opensearch

- name: Start OpenSearch
  ansible.builtin.systemd:
    name: opensearch
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the OpenSearch HTTP port
  ansible.builtin.wait_for:
    port: "{{ opensearch_http_port }}"
    timeout: 120
