---
- name: Fail early when the cluster's secrets did not reach the play
  ansible.builtin.assert:
    that:
      - splunk_admin_password | default('') | length > 0
    fail_msg: >-
      splunk_admin_password comes from ~/.forgelab/{{ cluster_name }}-credentials.yml
      via install.py — run the install stage rather than site.yml by hand.

- name: Controller-side cache directory
  ansible.builtin.file:
    path: "{{ splunkforwarder_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fetch the Universal Forwarder archive once, to the controller
  ansible.builtin.get_url:
    url: "{{ splunkforwarder_url }}"
    dest: "{{ splunkforwarder_cache_dir }}/{{ splunkforwarder_archive }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true

- name: Unpack the Universal Forwarder
  ansible.builtin.unarchive:
    src: "{{ splunkforwarder_cache_dir }}/{{ splunkforwarder_archive }}"
    dest: /opt
    owner: "{{ splunkforwarder_user }}"
    group: "{{ splunkforwarder_user }}"
    creates: "{{ splunkforwarder_home }}/bin/splunk"

# The archive ships splunk-launch.conf.default only; Splunk copies it into place
# on first start. The next task has to get in before that, so materialise it
# here — and never overwrite it afterwards, hence force: false.
- name: Materialise splunk-launch.conf from the shipped default
  ansible.builtin.copy:
    src: "{{ splunkforwarder_home }}/etc/splunk-launch.conf.default"
    dest: "{{ splunkforwarder_home }}/etc/splunk-launch.conf"
    remote_src: true
    force: false
    owner: "{{ splunkforwarder_user }}"
    group: "{{ splunkforwarder_user }}"
    mode: "0644"

# Before the first start, not after: splunkd reads this to decide which account
# to run as, and a first start performed by anyone else bakes that account in
# instead. Everything under SPLUNK_HOME then belongs to the wrong user.
- name: Pin the account splunkd runs as
  ansible.builtin.lineinfile:
    path: "{{ splunkforwarder_home }}/etc/splunk-launch.conf"
    regexp: '^#?\s*SPLUNK_OS_USER='
    line: "SPLUNK_OS_USER={{ splunkforwarder_user }}"
  notify: Restart splunkforwarder

# Notifies a restart because splunkd reads this only at startup: on an instance
# that is already running, writing the file alone changes nothing and the wait
# for the user database below would time out against it.
- name: Seed the admin account
  ansible.builtin.template:
    src: user-seed.conf.j2
    dest: "{{ splunkforwarder_home }}/etc/system/local/user-seed.conf"
    owner: "{{ splunkforwarder_user }}"
    group: "{{ splunkforwarder_user }}"
    mode: "0600"
  notify: Restart splunkforwarder

- name: Where this forwarder sends its data
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: "{{ splunkforwarder_home }}/etc/system/local/outputs.conf"
    owner: "{{ splunkforwarder_user }}"
    group: "{{ splunkforwarder_user }}"
    mode: "0644"
  notify: Restart splunkforwarder

- name: What this forwarder collects
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: "{{ splunkforwarder_home }}/etc/system/local/inputs.conf"
    owner: "{{ splunkforwarder_user }}"
    group: "{{ splunkforwarder_user }}"
    mode: "0644"
  notify: Restart splunkforwarder

- name: Universal Forwarder systemd unit
  ansible.builtin.template:
    src: splunkforwarder.service.j2
    dest: /etc/systemd/system/splunkforwarder.service
    mode: "0644"
  notify: Restart splunkforwarder

# Before the waits below, not after them: the config above notifies a restart,
# and on an already-running forwarder it is that restart which processes a
# re-seeded user-seed.conf. Waiting for the result first would time out against
# the instance that has not been restarted yet.
- name: Apply pending restarts before waiting on their result
  ansible.builtin.meta: flush_handlers

- name: Start the Universal Forwarder
  ansible.builtin.systemd:
    name: splunkforwarder
    state: started
    enabled: true
    daemon_reload: true

# Not the management port: a Universal Forwarder ships with it disabled, so
# unlike Splunk Enterprise it opens no socket to wait on. The pid file is what
# says splunkd got past its own prerequisite checks.
- name: Wait for splunkd to come up
  ansible.builtin.wait_for:
    path: "{{ splunkforwarder_home }}/var/run/splunk/splunkd.pid"
    timeout: 180

# The pid file appears the moment splunkd launches; the user database it builds
# from user-seed.conf lands much later. Deleting the seed in between leaves a
# forwarder whose CLI answers "No users exist. Please set up a user." — see
# roles/splunk/tasks/start.yml for the same race on the Enterprise side.
- name: Wait for the admin account to be created from the seed
  ansible.builtin.wait_for:
    path: "{{ splunkforwarder_home }}/etc/passwd"
    timeout: 300

- name: Drop the seed file now the admin exists
  ansible.builtin.file:
    path: "{{ splunkforwarder_home }}/etc/system/local/user-seed.conf"
    state: absent
