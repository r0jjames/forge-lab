---
# Multipass VMs are arm64 on Apple Silicon and amd64 elsewhere; the release
# asset names differ, so pick from the host's own architecture.
- name: Resolve the k9s release asset for this architecture
  ansible.builtin.set_fact:
    k8s_k9s_asset: "k9s_Linux_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"

- name: Download k9s
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ k8s_k9s_version }}/{{ k8s_k9s_asset }}"
    dest: "/tmp/{{ k8s_k9s_asset }}"
    mode: "0644"

- name: Install k9s
  ansible.builtin.unarchive:
    src: "/tmp/{{ k8s_k9s_asset }}"
    dest: /usr/local/bin
    remote_src: true
    include: [k9s]
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/k9s
