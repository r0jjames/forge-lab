---
# The cluster manager is also the license manager. Without a licence file every
# instance runs its own 60-day trial, which expires into Splunk Free — and Free
# forbids distributed search and forwarder authentication, so this topology
# would stop working rather than degrade. Warn, do not fail: a fresh clone with
# no licence must still provision.
- name: Look for a Splunk licence on the controller
  ansible.builtin.stat:
    path: "{{ splunk_license_file }}"
  delegate_to: localhost
  become: false
  register: splunk_license

- name: Warn when no licence is available
  ansible.builtin.debug:
    msg: >-
      No licence at {{ splunk_license_file }} — every instance will run its own
      60-day trial, which expires into Splunk Free and drops distributed search.
      Request a Developer Personal License at
      https://dev.splunk.com/enterprise/dev_license.
  when: not splunk_license.stat.exists

# Splunk creates this directory at first start, and the licence has to be in
# place before that start — so the role creates it rather than waiting.
- name: Licence directory
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/licenses/enterprise"
    state: directory
    owner: "{{ splunk_user }}"
    group: "{{ splunk_user }}"
    mode: "0755"
  when: splunk_license.stat.exists

# Owner and mode are not incidental: splunkd runs as the splunk user, and a
# licence it cannot read fails with `cannot read "...": Permission denied` while
# every other command still works.
# The extension is load-bearing. Splunk ignores anything else in this directory
# and says so only in splunkd.log, while `splunk list licenses` keeps reporting
# the trial as though no licence had been installed at all:
#   ERROR LMStack - License should have extension of '.lic' or '.license',
#   ignoring file forgelab-dev.xml
- name: Install the licence
  ansible.builtin.copy:
    src: "{{ splunk_license_file }}"
    dest: "{{ splunk_home }}/etc/licenses/enterprise/forgelab-dev.lic"
    owner: "{{ splunk_user }}"
    group: "{{ splunk_user }}"
    mode: "0640"
  when: splunk_license.stat.exists
  notify: Restart splunk

# Clusters built before the extension was corrected have the ignored file still
# sitting there; leaving it would keep that misleading log error coming.
- name: Remove the licence under its ignored name
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/licenses/enterprise/forgelab-dev.xml"
    state: absent
  notify: Restart splunk
