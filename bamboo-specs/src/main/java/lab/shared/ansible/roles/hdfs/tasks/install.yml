---
- name: Install a JRE
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true

# namenode.yml runs commands as hdfs_user via `become_user`. Ansible shares
# its per-task temp dir with that user through POSIX ACLs (setfacl); without
# the acl package it falls back to a BSD-style `chmod A+...` that GNU
# coreutils rejects outright, and every become_user task fails.
- name: Install acl for become_user privilege dropping
  ansible.builtin.apt:
    name: acl
    state: present

- name: Locate JAVA_HOME
  ansible.builtin.shell: |
    set -eo pipefail
    dirname "$(dirname "$(readlink -f "$(command -v java)")")"
  args: {executable: /bin/bash}
  register: hdfs_java
  changed_when: false

- name: Remember JAVA_HOME
  ansible.builtin.set_fact:
    hdfs_java_home: "{{ hdfs_java.stdout }}"

- name: Service account
  ansible.builtin.user:
    name: "{{ hdfs_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ hdfs_data_dir }}"
    create_home: false

# dfs.permissions.superusergroup is set to the hdfs group (see hdfs-site.xml.j2);
# without ubuntu in it, `hdfs dfsadmin -report` truncates the "Live datanodes"
# section for the login user verify.py runs as. Restarting the NameNode
# (notified below) is required for it to pick up the new group membership —
# it caches user->group mappings at process start.
- name: Add the login user to the hdfs group so it is an HDFS superuser
  ansible.builtin.user:
    name: "{{ hdfs_app_owner }}"
    groups: "{{ hdfs_user }}"
    append: true
  notify: [Restart hdfs namenode, Restart hdfs datanode]

- name: Data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hdfs_user }}"
    group: "{{ hdfs_user }}"
    mode: "0755"
  loop:
    - "{{ hdfs_data_dir }}"
    - "{{ hdfs_data_dir }}/name"
    - "{{ hdfs_data_dir }}/data"
    - "{{ hdfs_data_dir }}/tmp"
    - "{{ hdfs_data_dir }}/pid"
    - "{{ hdfs_home }}"

# unarchive's remote_src download used Ansible's default 10s socket-read
# timeout with no retries. Three data nodes pulling the ~1GB tarball at once
# through the same host NAT stalls past 10s and the task dies mid-transfer.
# get_url's own `timeout:` is the same kind of socket-read timeout, just
# raised generously, and `until`/`retries`/`delay` re-run the whole download
# on a stall instead of failing the play. `checksum:` (fetched from the
# mirror's published .sha512, itself a few hundred bytes) both catches a
# truncated transfer and gives idempotency: get_url skips re-downloading
# once the local file's digest already matches it.
- name: Download the Hadoop tarball
  ansible.builtin.get_url:
    url: "{{ hdfs_mirror }}/hadoop-{{ hdfs_version }}/hadoop-{{ hdfs_version }}.tar.gz"
    checksum: "sha512:{{ hdfs_mirror }}/hadoop-{{ hdfs_version }}/hadoop-{{ hdfs_version }}.tar.gz.sha512"
    dest: "/tmp/hadoop-{{ hdfs_version }}.tar.gz"
    mode: "0644"
    timeout: 180
  register: hdfs_tarball_download
  until: hdfs_tarball_download is succeeded
  retries: 3
  delay: 15

- name: Unpack Hadoop
  ansible.builtin.unarchive:
    src: "/tmp/hadoop-{{ hdfs_version }}.tar.gz"
    dest: "{{ hdfs_home }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: "{{ hdfs_user }}"
    group: "{{ hdfs_user }}"
    creates: "{{ hdfs_home }}/bin/hdfs"

- name: Configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ hdfs_home }}/etc/hadoop/{{ item }}"
    owner: "{{ hdfs_user }}"
    group: "{{ hdfs_user }}"
    mode: "0644"
  loop: [core-site.xml, hdfs-site.xml, hadoop-env.sh]
  notify: [Restart hdfs namenode, Restart hdfs datanode]

# verify.py logs in as ubuntu and runs `hdfs dfs`; without this it is not on PATH.
- name: Hadoop on every user's PATH
  ansible.builtin.template:
    src: hadoop-env.sh.j2
    dest: /etc/profile.d/hadoop.sh
    mode: "0644"

# /etc/profile.d is only sourced for login shells; a bare, non-interactive
# `ssh host cmd` (verify.py's invocation) never reads it. /usr/local/bin is
# on the default PATH for every SSH session, login or not.
- name: Hadoop on PATH for non-interactive SSH sessions too
  ansible.builtin.template:
    src: hdfs-wrapper.sh.j2
    dest: /usr/local/bin/hdfs
    mode: "0755"

- name: Systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [hdfs-namenode.service, hdfs-datanode.service]
