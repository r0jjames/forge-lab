---
- name: Restart hdfs namenode
  ansible.builtin.systemd:
    name: hdfs-namenode
    state: restarted
    daemon_reload: true
  when: inventory_hostname == groups['data'][0]

- name: Restart hdfs datanode
  ansible.builtin.systemd:
    name: hdfs-datanode
    state: restarted
    daemon_reload: true
