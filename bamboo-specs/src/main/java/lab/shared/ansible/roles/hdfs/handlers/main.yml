---
# Each host only has the unit its group gives it, so both handlers guard: the
# config template notifies both on every HDFS node.
- name: Restart hdfs namenode
  ansible.builtin.systemd:
    name: hdfs-namenode
    state: restarted
    daemon_reload: true
  when: inventory_hostname in groups['namenode']

- name: Restart hdfs datanode
  ansible.builtin.systemd:
    name: hdfs-datanode
    state: restarted
    daemon_reload: true
  when: inventory_hostname in groups['datanode']
