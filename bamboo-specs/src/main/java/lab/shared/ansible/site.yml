---
- name: Base preparation (all nodes)
  hosts: all
  become: true
  roles:
    - common

- name: Kubernetes install
  hosts: k8s_nodes
  become: true
  roles:
    - role: k8s
      when: cluster_type == "k8s"

- name: DC/OS install
  hosts: k8s_nodes
  become: true
  roles:
    - role: dcos
      when: cluster_type == "dcos"

- name: Keycloak on the cluster
  hosts: management[0]
  become: true
  roles:
    - role: keycloak
      when: "'keycloak' in (addons | default('')).split(',')"

- name: HDFS on the namenode and datanodes
  hosts: hdfs_nodes
  become: true
  roles:
    - role: hdfs
      when: "'hdfs' in (addons | default('')).split(',')"

- name: OpenSearch on the opensearch nodes
  hosts: opensearch_nodes
  become: true
  roles:
    - role: opensearch
      when: "'opensearch' in (addons | default('')).split(',')"

- name: Splunk Enterprise on the splunk nodes
  hosts: splunk_nodes
  become: true
  roles:
    - role: splunk
      when: "'splunk' in (addons | default('')).split(',')"

# Every node that is not itself a Splunk instance forwards its logs into the
# cluster. The forwarder is native arm64 even though Splunk Enterprise is not,
# so this play is the fast half of the deployment.
- name: Splunk Universal Forwarder everywhere else
  hosts: all:!splunk_nodes
  become: true
  roles:
    - role: splunkforwarder
      when: "'splunk' in (addons | default('')).split(',')"

# Hand the component facts the roles set back to provision.py, which renders
# them into cluster_registered/<cluster>_cluster_info.yml. forgelab_components
# is set with set_fact, which is host-scoped, and roles run on different host
# groups (k8s on management+compute, keycloak on management[0], hdfs on
# hdfs_nodes, opensearch on opensearch_nodes) -- so no single host has the full
# picture. Aggregate across every host in the (naturally sorted, so stable)
# inventory before writing.
- name: Record installed components
  hosts: management[0]
  gather_facts: false
  become: false
  tasks:
    - name: Collect the component facts every role reported
      ansible.builtin.set_fact:
        forgelab_all_components: >-
          {{ groups['all']
             | map('extract', hostvars, 'forgelab_components')
             | select('defined') | sum(start=[])
             | unique(attribute='name') }}

    - name: Write the component report for the provision script
      ansible.builtin.copy:
        content: "{{ forgelab_all_components | to_nice_json }}\n"
        dest: "{{ component_report }}"
        mode: "0644"
      delegate_to: localhost
      when: component_report | default('') | length > 0
